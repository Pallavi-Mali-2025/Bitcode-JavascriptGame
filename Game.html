<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rock Paper Scissors</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 350px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .choice-btn {
            width: 90px;
            height: 90px;
            font-size: 30px;
            border-radius: 50%;
            margin: 10px;
            border: none;
            transition: 0.3s;
        }

        .choice-btn:hover {
            transform: scale(1.2);
        }

        .score {
            font-size: 18px;
            margin-top: 10px;
        }

        .result {
            font-size: 20px;
            margin-top: 15px;
            font-weight: bold;
        }

        .reset-btn {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="game-card">
    <h3 class="mb-3">🎮 Rock Paper Scissors</h3>

    <!-- Buttons -->
    <div>
        <button class="choice-btn btn btn-light" onclick="play('rock')">✊</button>
        <button class="choice-btn btn btn-light" onclick="play('paper')">📄</button>
        <button class="choice-btn btn btn-light" onclick="play('scissors')">✂️</button>
    </div>

    <!-- Result -->
    <div class="result" id="result">Make your move!</div>

    <!-- Score -->
    <div class="score">
        You: <span id="userScore">0</span> |
        Computer: <span id="compScore">0</span>
    </div>

    <!-- Reset -->
    <button class="btn btn-warning reset-btn" onclick="resetGame()">Reset</button>
</div>

<script>
let userScore = 0;
let compScore = 0;

function play(userChoice) {
    let choices = ['rock', 'paper', 'scissors'];
    let compChoice = choices[Math.floor(Math.random() * 3)];

    let resultText = "";

    if (userChoice === compChoice) {
        resultText = "It's a Draw 😐";
    } else if (
        (userChoice === 'rock' && compChoice === 'scissors') ||
        (userChoice === 'paper' && compChoice === 'rock') ||
        (userChoice === 'scissors' && compChoice === 'paper')
    ) {
        userScore++;
        resultText = "You Win! 🎉";
    } else {
        compScore++;
        resultText = "Computer Wins! 😢";
    }

    document.getElementById("result").innerText =
        `You: ${userChoice} | Computer: ${compChoice} → ${resultText}`;

    document.getElementById("userScore").innerText = userScore;
    document.getElementById("compScore").innerText = compScore;
}

function resetGame() {
    userScore = 0;
    compScore = 0;
    document.getElementById("userScore").innerText = 0;
    document.getElementById("compScore").innerText = 0;
    document.getElementById("result").innerText = "Game Reset! Play again 😊";
}
</script>

</body>
</html>
